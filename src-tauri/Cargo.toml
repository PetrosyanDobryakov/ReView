[package]
name = "review"
version = "0.15.28"
description = "ReView — minimal Tauri 2 desktop shell (Linux WebKitGTK)"
authors = ["Warexpor JR"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "review_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
