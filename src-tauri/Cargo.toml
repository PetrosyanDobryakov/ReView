[package]
name = "review-desktop"
version = "0.1.0"
description = "ReView desktop and Android shell. Loads the Vite frontend. Does not replace review-sync."
license = "Apache-2.0"
repository = "https://github.com/PetrosyanDobryakov/ReView"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "review_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
