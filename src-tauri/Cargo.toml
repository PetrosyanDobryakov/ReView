[package]
name = "review-desktop"
version = "0.1.0"
description = "ReView desktop and Android shell. Loads the Vite frontend. Does not replace review-sync."
license = "Apache-2.0"
repository = "https://github.com/PetrosyanDobryakov/ReView"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "review_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
# Desktop shell plugins (frontend bindings in package.json must match majors).
# NOTE: unverified by build here (no cargo/MSVC on this machine) — first
# `tauri build` will confirm; then also refresh rust-version (fs needs 1.90+).
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
