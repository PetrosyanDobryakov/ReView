# Optional static copy of the web UI: Worker **review** — https://review.zpro-driftman.workers.dev/
# ReView is self-hosted P2P; there is no sync worker. See docs/DEPLOY.md.
name = "review"
account_id = "3058d81da41b02e06744d5d058570aab"
compatibility_date = "2026-08-29"

# Wrangler runs this before `wrangler deploy` and `wrangler versions upload`.
# Without it, Cloudflare uploads a stale/empty dist/.
# Workers Builds does NOT honor this [build] block — set Build/Deploy in the dashboard.
[build]
command = "npm run build"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
