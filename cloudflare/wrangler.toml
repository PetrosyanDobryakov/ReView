# Worker **review-hub**: ReView signaling hub only (no web UI, no storage).
# Deploy: bash scripts/deploy.sh hub   (or: npx wrangler deploy -c cloudflare/wrangler.toml)
# Then build your UI with VITE_HUBS=wss://review-hub.<account>.workers.dev
name = "review-hub"
# Amicus account (new, hub only). The old review / review-sync Workers stay on the zpro account untouched.
account_id = "2f8144b0acc394459de5ca531dcfddf5"
compatibility_date = "2026-08-29"
main = "worker.ts"

[vars]
HUB_NAME = "Cloudflare"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SignalRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]
