[package]
name = "review-sync-do"
version = "0.1.0"
edition = "2021"
description = "ReView sync Durable Object (Rust wasm). This is what wrangler deploy publishes."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-lock = "3"
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
worker = "0.8.6"
yrs = { version = "0.28", features = ["sync"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
