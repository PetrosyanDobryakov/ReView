# Durable Object Worker **review-sync** — https://review-sync.zpro-driftman.workers.dev/
# Builds Root directory for this Worker must be `worker` (this folder), not repo root.
# Repo-root wrangler.toml is the SPA (**review**); do not change its name to match this file.
name = "review-sync"
account_id = "3058d81da41b02e06744d5d058570aab"
# Rust wasm Durable Object. worker-build 0.8 writes build/index.js + index_bg.wasm.
# src/index.ts is not uploaded. build/worker/shim.mjs only re-exports index.js.
main = "build/index.js"
compatibility_date = "2024-10-01"
# Auto-reply Close frames so half-open sockets do not linger as dashboard
# "client disconnected" / responseStreamDisconnected noise (also safe with
# explicit ws.close in BoardRoom.webSocketClose).
compatibility_flags = ["nodejs_compat", "web_socket_auto_reply_to_close"]

[build]
command = "bash ../scripts/build-sync-worker.sh"

[[rules]]
globs = ["**/*.wasm"]
type = "CompiledWasm"
fallthrough = false

# Destructive DELETE /room/<name> requires a Worker secret:
#   wrangler secret put REVIEW_COMPACT_TOKEN
#   (or REVIEW_ROOM_DELETE_TOKEN)
# Fail closed when unset. Clients send X-Review-Compact-Token /
# X-Review-Room-Delete-Token / Authorization: Bearer <token>.

[durable_objects]
bindings = [
  { name = "BOARD_ROOM", class_name = "BoardRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardRoom"]

[observability]
enabled = true
# Full sample was ~300k events/day and amplified dash noise during DO storms.
# Does not change DO billing; cuts log volume while we still see error spikes.
head_sampling_rate = 0.1
