name = "review-sync"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Destructive DELETE /room/<name> requires a Worker secret:
#   wrangler secret put REVIEW_COMPACT_TOKEN
#   (or REVIEW_ROOM_DELETE_TOKEN)
# Fail closed when unset. Clients send X-Review-Compact-Token /
# X-Review-Room-Delete-Token / Authorization: Bearer <token>.

[durable_objects]
bindings = [
  { name = "BOARD_ROOM", class_name = "BoardRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardRoom"]

[observability]
enabled = true
# Full sample was ~300k events/day and amplified dash noise during DO storms.
# Does not change DO billing; cuts log volume while we still see error spikes.
head_sampling_rate = 0.1
