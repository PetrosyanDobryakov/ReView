name: Desktop release (P2P)

# Desktop installers for the peer-to-peer line only. Runs when a tag
# `p2p-desktop-v*` is pushed (tag a commit on claude/full-p2p-desktop) and
# publishes a GitHub prerelease, never marked "latest".
#
# The app is Electron (electron/, electron-builder.yml) with review-host
# (rust/review-host) shipped beside it. Builds bake in the Cloudflare hub
# (VITE_HUBS), so two installs anywhere on the internet meet on the same
# board. The hub only introduces peers; board data and media go device to
# device over WebRTC.
#
#   git tag p2p-desktop-v0.16.0 && git push origin p2p-desktop-v0.16.0

on:
  push:
    tags: ['p2p-desktop-v*']

permissions:
  contents: write

env:
  VITE_HUBS: wss://review-hub.amicus-vamicus.workers.dev

jobs:
  # The live hub from a network that reaches workers.dev: signaling, /turn
  # credentials, and two browsers linked only through TURN.
  hub-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: CF_HUB_URL=https://review-hub.amicus-vamicus.workers.dev npm run test:cf
      - run: npm run build
      - run: TURN_ONLY=1 node scripts/relay-e2e.mjs

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            host: ''
            args: --win --x64
          - os: ubuntu-22.04
            host: ''
            args: --linux --x64
          - os: macos-latest
            host: ''
            args: --mac --arm64
          - os: macos-latest
            host: x86_64-apple-darwin
            args: --mac --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.host }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - run: npm ci

      - name: Build installers
        shell: bash
        run: node scripts/desktop.mjs --dist ${{ matrix.host && format('--target {0}', matrix.host) || '' }} -- ${{ matrix.args }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'ReView P2P desktop ${{ github.ref_name }}'
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          make_latest: false
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          body: |
            Desktop app for the peer-to-peer line (branch `claude/full-p2p-desktop`). Not the main ReView release.

            Boards and media go only between your devices over WebRTC. The built-in hub `wss://review-hub.amicus-vamicus.workers.dev` just introduces peers and stores nothing.

            **Install**
            - Windows: `ReView-<version>-win-x64.exe`. Unsigned, so SmartScreen warns: More info, Run anyway.
            - macOS: `*-mac-arm64.dmg` (Apple Silicon) or `*-mac-x64.dmg` (Intel). Unsigned: after copying to Applications run `xattr -cr /Applications/ReView.app`, then open it.
            - Linux: `.AppImage` (`chmod +x`) or `.deb`.

            Boards saved by the earlier (Tauri) desktop builds are picked up automatically: the app keeps using the same data folder.

            **Board with a friend**
            1. Both install and open the app.
            2. One creates a board and copies its invite link from Members.
            3. The other opens that link (or pastes the board link into the app). Both should show as linked in Settings, Connection.

            Behind strict networks (CGNAT, locked-down wifi) both may sit in the room without linking; that needs a TURN server under Settings, Connection, Advanced.
