name: CI

on:
  push:
    branches: [main, dev-warexpor]
  pull_request:
    branches: [main, dev-warexpor]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
