[package]
name = "review-host"
version = "0.1.0"
edition = "2021"
description = "ReView self-host: serves the web UI, a stateless WebRTC signaling hub and LAN discovery. Stores no board data."
license = "Apache-2.0"
publish = false

[lib]
name = "review_host"
path = "src/lib.rs"

[[bin]]
name = "review-host"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
if-addrs = "0.13"
mdns-sd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.28"
